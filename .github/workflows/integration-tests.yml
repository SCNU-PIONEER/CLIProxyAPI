name: integration-tests

on:
  push:
    branches:
      - 'merge/plus-main-*'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend
        working-directory: web
        run: npm ci
      - name: Test frontend API contracts
        working-directory: web
        run: npm test
      - name: Lint frontend
        working-directory: web
        run: npm run lint
      - name: Export and embed Plus dashboard
        working-directory: web
        run: npm run build:embed
      - name: Test
        if: ${{ !cancelled() }}
        run: go test ./...
      - name: Race-check Home reconnect regression
        if: ${{ !cancelled() }}
        run: go test -race ./sdk/cliproxy -run 'TestServeInitialOverlayPluginConnectionToleratesRepeatedFreshCommandProbes|TestServiceInitialOverlayStagesPluginWritesUntilReady' -count=3
      - name: Race-check Home blocked RPC cancellation
        if: ${{ !cancelled() }}
        run: go test -race ./internal/home -run '^Test(ClusterBalanceBlockedRPCDoesNotDelayHeartbeatExpiry|RebalanceTransportTracker.*|RebalanceCommandCancelAbortsBlockedTransport)$' -count=3
      - name: Race-check Plus credentials and OAuth
        if: ${{ !cancelled() }}
        run: go test -race ./sdk/cliproxy ./sdk/cliproxy/auth ./sdk/auth ./internal/runtime/executor ./internal/auth/cursor/proto ./internal/api/handlers/management ./internal/watcher/synthesizer -run 'Plus|Kiro|BT|H2Stream|LoginChallenge|GitLab|Qoder|CodeArts|JoyCode|Cursor' -count=1
      - name: Race-check OAuth persistence fixture isolation
        if: ${{ !cancelled() }}
        run: go test -race ./internal/api/handlers/management -run '^TestPlusOAuth(HandlersAreIsolated|LoginMetadataWhitelist|TerminalStatusJoinsCommitWrite)$' -count=20
      - name: Race-check Kiro token-file reload stability
        if: ${{ !cancelled() }}
        run: go test -race ./sdk/cliproxy -run '^TestKiroTokenFile' -count=20
      - name: Race-check late interrupt lifecycle
        if: ${{ !cancelled() }}
        run: go test -race ./sdk/api/handlers/openai -run '^TestResponses(LocalInterrupt.*|HTTPTerminalInterruptsUseCurrentTurn|LateInterruptDoesNotPoisonNextCreate|InterruptStopsHTTPUpstream)$' -count=20
      - name: Build
        if: ${{ !cancelled() }}
        run: go build -o "${RUNNER_TEMP}/cli-proxy-api" ./cmd/server
